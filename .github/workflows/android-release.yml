name: Build APK & Auto Publish GitHub Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Phiên bản cần phát hành (vd: 1.0.3, 1.0.4)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build TikStudio HD APK & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Set up JDK 21 (Required for AGP 9.1+ & Gradle 9.3.1)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 3. Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: 4. Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 5. Generate Debug Keystore if Missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: 6. Determine Version Tag Dynamically
        id: prep_version
        run: |
          if [ -n "${{ github.event.inputs.release_version }}" ]; then
            RAW_VER="${{ github.event.inputs.release_version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW_VER="${GITHUB_REF_NAME#v}"
          elif [ -f version.txt ]; then
            RAW_VER=$(cat version.txt | tr -d '[:space:]')
          else
            RAW_VER="1.0.3"
          fi
          CLEAN_VER="${RAW_VER#v}"

          # Check if release tag v${CLEAN_VER} already exists in GitHub repository
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v${CLEAN_VER}")

          if [ "$HTTP_STATUS" = "200" ] && [[ "${{ github.ref }}" != refs/tags/* ]]; then
            FINAL_VER="${CLEAN_VER}.${{ github.run_number }}"
          else
            FINAL_VER="${CLEAN_VER}"
          fi

          APK_NAME="TikStudio-HD-${FINAL_VER}.apk"
          BUILD_CODE=$(( ${{ github.run_number }} + 100 ))

          echo "version_tag=${FINAL_VER}" >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "build_code=${BUILD_CODE}" >> $GITHUB_OUTPUT
          echo "==> Releasing TikStudio HD: ${FINAL_VER} (Code: ${BUILD_CODE}, APK: ${APK_NAME})"

      - name: 7. Build APK for Release (${{ steps.prep_version.outputs.version_tag }})
        run: |
          gradle :app:assembleDebug --no-daemon \
            -Pandroid.builder.sdkDownload=true \
            -PversionName="${{ steps.prep_version.outputs.version_tag }}" \
            -PversionCode="${{ steps.prep_version.outputs.build_code }}"

      - name: 8. Prepare Versioned APK File
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "${{ steps.prep_version.outputs.apk_name }}"
          ls -lh "${{ steps.prep_version.outputs.apk_name }}"

      - name: 9. Publish GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.prep_version.outputs.version_tag }}
          name: "TikStudio HD ${{ steps.prep_version.outputs.version_tag }}"
          body: |
            ### 🚀 Bản cập nhật mới TikStudio HD (${{ steps.prep_version.outputs.version_tag }})
            - **Phiên bản:** `${{ steps.prep_version.outputs.version_tag }}`
            - **Commit:** `${{ github.sha }}`
            - **Nhánh:** `${{ github.ref_name }}`
            - **Tệp cài đặt:** `${{ steps.prep_version.outputs.apk_name }}`

            Mở ứng dụng trên điện thoại để nhận thông báo và tự động tải về bản cập nhật ${{ steps.prep_version.outputs.version_tag }} này.
          files: ${{ steps.prep_version.outputs.apk_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
