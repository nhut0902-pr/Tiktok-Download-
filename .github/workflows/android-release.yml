name: Build APK & Auto Publish GitHub Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build TikStudio HD APK & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Gradle & Android SDK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: 4. Generate Debug Keystore if Missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: 5. Build APK (Assemble Debug / Release)
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: 6. Prepare Versioned APK Artifact
        id: prep_version
        run: |
          VERSION_TAG="v1.0.${{ github.run_number }}"
          APK_NAME="TikStudio-HD-${VERSION_TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${APK_NAME}"
          echo "version_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT

      - name: 7. Publish GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep_version.outputs.version_tag }}
          name: "TikStudio HD ${{ steps.prep_version.outputs.version_tag }} (Auto Build)"
          body: |
            ### 🚀 Bản cập nhật tự động TikStudio HD (${{ steps.prep_version.outputs.version_tag }})
            - **Commit:** `${{ github.sha }}`
            - **Nhánh:** `${{ github.ref_name }}`
            - **Tệp cài đặt:** `${{ steps.prep_version.outputs.apk_name }}`

            Ứng dụng trên điện thoại sẽ tự động nhận diện bản Release này qua GitHub API và thông báo tải về cập nhật trực tiếp.
          files: ${{ steps.prep_version.outputs.apk_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
